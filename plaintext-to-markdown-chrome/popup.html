<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素记</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
        <defs>
            <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/>
                <path d="M19 13l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z"/>
            </symbol>
            <symbol id="icon-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M15 3v18"/>
            </symbol>
            <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="M4.93 4.93l1.41 1.41"/>
                <path d="M17.66 17.66l1.41 1.41"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
                <path d="M6.34 17.66l-1.41 1.41"/>
                <path d="M19.07 4.93l-1.41 1.41"/>
            </symbol>
            <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </symbol>
            <symbol id="icon-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v5h5"/>
                <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
                <path d="M12 7v5l4 2"/>
            </symbol>
            <symbol id="icon-prompt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </symbol>
            <symbol id="icon-paste" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/>
                <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/>
            </symbol>
            <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </symbol>
            <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <line x1="10" y1="9" x2="8" y2="9"/>
            </symbol>
            <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </symbol>
            <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </symbol>
            <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </symbol>
        </defs>
    </svg>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">
                    <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-sparkle"/></svg>
                </span>
                <span class="logo-text">素记</span>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle" title="切换深色模式" aria-label="切换深色模式">
                    <svg class="icon" aria-hidden="true"><use href="#icon-moon"/></svg>
                </button>
                <button id="open-sidepanel" class="icon-btn" title="在侧边栏打开" aria-label="在侧边栏打开">
                    <svg class="icon" aria-hidden="true"><use href="#icon-panel"/></svg>
                </button>
            </div>
        </header>

        <!-- API Settings -->
        <div class="section">
            <div class="section-header">
                <span>API 设置</span>
                <button id="toggle-api" class="link-btn">显示/隐藏</button>
            </div>
            <div id="api-panel" class="api-panel hidden">
                <select id="ai-provider" class="select"></select>
                <input type="password" id="api-key" placeholder="API Key" class="input">
                <p class="help-text"><a id="api-key-link" href="#" target="_blank">获取 API Key</a></p>
                <div class="setting-row">
                    <select id="ai-model" class="select"></select>
                    <select id="heading-level" class="select">
                        <option value="1"># H1</option>
                        <option value="2">## H2</option>
                        <option value="3">### H3</option>
                        <option value="4">#### H4</option>
                    </select>
                </div>
                <p class="help-text">标题起始级别：输出的最高级标题</p>

                <div class="switch-row">
                    <span>转换完成自动复制</span>
                    <input type="checkbox" id="auto-copy" class="switch">
                </div>

                <button id="test-api" class="btn-small">测试连接</button>
                <div class="style-template-header">
                    <label class="template-label">风格模板</label>
                    <span id="style-template-counter" class="char-counter">0 / 800</span>
                </div>
                <textarea id="style-template" class="textarea style-template-area"
                    placeholder="粘贴喜欢的 Markdown 样例，AI 会模仿其格式风格..."></textarea>
                <button id="clear-style-template" class="btn-small secondary" style="align-self:flex-end">清除</button>
            </div>
        </div>

        <!-- Custom Prompts -->
        <div class="section">
            <div class="section-header">
                <span>
                    <svg class="icon" aria-hidden="true"><use href="#icon-prompt"/></svg>
                    自定义提示词
                </span>
                <button id="toggle-prompts" class="link-btn">显示/隐藏</button>
            </div>
            <div id="prompts-panel" class="api-panel hidden">
                <select id="prompt-doc-type" class="select prompt-type-select"></select>
                <div class="prompt-editor">
                    <label>系统角色</label>
                    <textarea id="custom-system" class="textarea" placeholder="你是专业的 Markdown 格式化专家..."></textarea>
                    <span class="hint">可用占位符：{HEADING_INSTRUCTION}、{TEXT}</span>
                    <label>转换模板</label>
                    <textarea id="custom-template" class="textarea" placeholder="将以下文本转换为 Markdown..."></textarea>
                </div>
                <div class="toolbar">
                    <button id="save-prompt" class="btn-small">保存</button>
                    <button id="reset-prompt" class="btn-small secondary">重置默认</button>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="section">
            <div class="section-header">
                <span>
                    <svg class="icon" aria-hidden="true"><use href="#icon-history"/></svg>
                    历史记录
                </span>
                <button id="toggle-history" class="link-btn">显示/隐藏</button>
            </div>
            <div id="history-panel" class="history-panel hidden">
                <div class="history-empty">暂无历史记录</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="section">
            <div class="section-header">
                <span>输入</span>
                <button id="paste-btn" class="link-btn">
                    <svg class="icon" aria-hidden="true"><use href="#icon-paste"/></svg>
                    粘贴
                </button>
            </div>
            <textarea id="input-text" placeholder="在此粘贴或输入纯文本..." class="textarea"></textarea>
            <div class="toolbar">
                <button id="clear-btn" class="btn-small secondary">
                    <svg class="icon" aria-hidden="true"><use href="#icon-trash"/></svg>
                    清空
                </button>
                <button id="sample-btn" class="btn-small secondary">
                    <svg class="icon" aria-hidden="true"><use href="#icon-file"/></svg>
                    示例
                </button>
            </div>
        </div>

        <!-- Convert Button -->
        <div class="convert-row">
            <button id="convert-btn" class="btn-primary">
                <svg class="icon btn-icon-svg" aria-hidden="true"><use href="#icon-sparkle"/></svg>
                <span id="btn-text">AI 智能转换</span>
            </button>
            <select id="doc-type-override" class="select doc-type-select" title="文档类型">
                <option value="auto">自动识别</option>
                <option value="technical_doc">技术文档</option>
                <option value="meeting_notes">会议记录</option>
                <option value="code_snippet">代码片段</option>
                <option value="data_report">数据报告</option>
                <option value="general_prose">通用文本</option>
            </select>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span>AI 正在分析...</span>
        </div>

        <!-- Output Area -->
        <div class="section">
            <div class="section-header">
                <span>输出</span>
                <div class="output-actions">
                    <button id="copy-btn" class="link-btn">
                        <svg class="icon" aria-hidden="true"><use href="#icon-copy"/></svg>
                        复制
                    </button>
                    <button id="download-btn" class="link-btn">
                        <svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg>
                        下载
                    </button>
                </div>
            </div>
            <textarea id="output-text" placeholder="转换后的 Markdown 将显示在这里..." class="textarea output" readonly></textarea>
            <div id="output-preview" class="preview hidden"></div>
            <div class="toolbar">
                <button id="preview-toggle" class="btn-small secondary">
                    <svg class="icon" aria-hidden="true"><use href="#icon-eye"/></svg>
                    预览
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span id="status-text">就绪</span>
            <span class="shortcuts">Ctrl+Shift+M</span>
        </footer>
    </div>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
</body>
</html>
