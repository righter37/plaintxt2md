<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Markdown - Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <div>
                    <div class="logo-title">AI Text → Markdown</div>
                    <div class="logo-subtitle">智能文本转换工具</div>
                </div>
            </div>
        </header>

        <!-- Mode Selection -->
        <div class="mode-bar">
            <button class="mode-btn active" data-mode="ai">
                <span class="mode-icon">🧠</span>
                <div class="mode-info">
                    <div class="mode-name">AI 智能转换</div>
                    <div class="mode-desc">大模型分析，效果更好</div>
                </div>
            </button>
            <button class="mode-btn" data-mode="local">
                <span class="mode-icon">⚡</span>
                <div class="mode-info">
                    <div class="mode-name">本地转换</div>
                    <div class="mode-desc">无需网络，即时响应</div>
                </div>
            </button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settings-panel">
            <div class="panel-header">
                <span>⚙️ 设置</span>
                <button id="toggle-settings" class="btn-icon">▼</button>
            </div>
            <div class="panel-content" id="settings-content">
                <div class="setting-group">
                    <label>API Key</label>
                    <div class="input-group">
                        <input type="password" id="api-key" class="input" placeholder="输入 DashScope API Key">
                        <button id="toggle-key-visibility" class="btn-small">显示</button>
                    </div>
                    <p class="help-text">在 <a href="https://dashscope.aliyun.com/" target="_blank">DashScope 控制台</a> 获取 API Key</p>
                </div>
                
                <div class="setting-row">
                    <div class="setting-group">
                        <label>AI 模型</label>
                        <select id="ai-model" class="select">
                            <option value="qwen-turbo">通义千问 Turbo (快速)</option>
                            <option value="qwen-plus" selected>通义千问 Plus (平衡)</option>
                            <option value="qwen-max">通义千问 Max (最强)</option>
                        </select>
                    </div>
                    
                    <div class="setting-group">
                        <label>输出风格</label>
                        <select id="output-style" class="select">
                            <option value="standard" selected>标准 Markdown</option>
                            <option value="github">GitHub 风格</option>
                            <option value="minimal">简洁风格</option>
                            <option value="detailed">详细风格</option>
                        </select>
                    </div>
                </div>
                
                <button id="test-api" class="btn-secondary">测试连接</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Input Section -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <span class="icon">📥</span>
                        输入 (Plain Text)
                    </div>
                    <div class="section-actions">
                        <button id="get-page-text" class="btn-small">获取页面选中文字</button>
                        <button id="paste-btn" class="btn-small">粘贴</button>
                        <button id="clear-btn" class="btn-small secondary">清空</button>
                        <button id="sample-btn" class="btn-small secondary">示例</button>
                    </div>
                </div>
                <textarea id="input-text" class="textarea" placeholder="在此粘贴或输入纯文本内容...

AI 会智能分析：
- 识别标题层级和文档结构
- 检测代码块并标注语言
- 识别表格、列表、链接
- 判断段落边界"></textarea>
                <div class="input-stats" id="input-stats">0 字符 | 0 行</div>
            </div>

            <!-- Convert Button -->
            <div class="convert-bar">
                <button id="convert-btn" class="btn-convert">
                    <span class="btn-icon">✨</span>
                    <span id="btn-text">AI 智能转换</span>
                </button>
                <div id="loading-indicator" class="loading hidden">
                    <div class="spinner"></div>
                    <span>AI 正在分析文本结构...</span>
                </div>
            </div>

            <!-- Output Section -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <span class="icon">📤</span>
                        输出 (Markdown)
                    </div>
                    <div class="section-actions">
                        <div class="view-toggle">
                            <button class="view-btn active" data-view="source">源码</button>
                            <button class="view-btn" data-view="preview">预览</button>
                            <button class="view-btn" data-view="split">分屏</button>
                        </div>
                        <button id="copy-btn" class="btn-small">复制</button>
                        <button id="download-btn" class="btn-small">下载</button>
                    </div>
                </div>
                
                <div class="output-container">
                    <!-- Source View -->
                    <div id="view-source" class="view-content">
                        <textarea id="output-text" class="textarea output" readonly placeholder="转换后的 Markdown 将显示在这里..."></textarea>
                    </div>
                    
                    <!-- Preview View -->
                    <div id="view-preview" class="view-content hidden">
                        <div id="preview-content" class="preview-area"></div>
                    </div>
                    
                    <!-- Split View -->
                    <div id="view-split" class="view-content split hidden">
                        <textarea id="output-text-split" class="textarea output" readonly></textarea>
                        <div id="preview-content-split" class="preview-area"></div>
                    </div>
                </div>
                
                <div class="output-stats" id="output-stats">0 字符</div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span id="status-text">就绪</span>
            <div class="shortcuts">
                <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> 打开弹出窗口
                <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 打开侧边栏
            </div>
        </footer>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
