<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素记 - Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
        <defs>
            <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/>
                <path d="M19 13l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z"/>
            </symbol>
            <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </symbol>
            <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
            </symbol>
            <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="M4.93 4.93l1.41 1.41"/>
                <path d="M17.66 17.66l1.41 1.41"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
                <path d="M6.34 17.66l-1.41 1.41"/>
                <path d="M19.07 4.93l-1.41 1.41"/>
            </symbol>
            <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </symbol>
            <symbol id="icon-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v5h5"/>
                <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
                <path d="M12 7v5l4 2"/>
            </symbol>
            <symbol id="icon-prompt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </symbol>
            <symbol id="icon-page" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                <polyline points="14 2 14 8 20 8"/>
            </symbol>
            <symbol id="icon-cursor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                <path d="M13 13l6 6"/>
            </symbol>
            <symbol id="icon-paste" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/>
                <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/>
            </symbol>
            <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </symbol>
            <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <line x1="10" y1="9" x2="8" y2="9"/>
            </symbol>
            <symbol id="icon-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"/>
                <polyline points="8 6 2 12 8 18"/>
            </symbol>
            <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </symbol>
            <symbol id="icon-split" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M12 3v18"/>
            </symbol>
            <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </symbol>
            <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </symbol>
            <symbol id="icon-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v14"/>
                <path d="m19 10-7 7-7-7"/>
            </symbol>
            <symbol id="icon-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21V7"/>
                <path d="m5 14 7-7 7 7"/>
            </symbol>
        </defs>
    </svg>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">
                    <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-sparkle"/></svg>
                </span>
                <div>
                    <div class="logo-title">素记</div>
                    <div class="logo-subtitle">智能文本转换工具</div>
                </div>
            </div>
            <button id="theme-toggle" class="theme-toggle" title="切换深色模式" aria-label="切换深色模式">
                <svg class="icon" aria-hidden="true"><use href="#icon-moon"/></svg>
            </button>
        </header>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settings-panel">
            <div class="panel-header" id="toggle-settings">
                <span class="panel-title">
                    <svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg>
                    设置
                </span>
                <svg class="icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
            </div>
            <div class="panel-content" id="settings-content">
                <div class="setting-group">
                    <label>AI 供应商</label>
                    <select id="ai-provider" class="select"></select>
                </div>

                <div class="setting-group">
                    <label>API Key</label>
                    <div class="input-group">
                        <input type="password" id="api-key" class="input" placeholder="输入 API Key">
                        <button id="toggle-key-visibility" class="btn-small">显示</button>
                    </div>
                    <p class="help-text">在 <a id="api-key-link" href="#" target="_blank">控制台</a> 获取 API Key</p>
                </div>

                <div class="setting-row">
                    <div class="setting-group">
                        <label>AI 模型</label>
                        <select id="ai-model" class="select"></select>
                    </div>

                    <div class="setting-group">
                        <label>标题起始级别</label>
                        <select id="heading-level" class="select">
                            <option value="1"># H1（最高级）</option>
                            <option value="2">## H2</option>
                            <option value="3">### H3</option>
                            <option value="4">#### H4</option>
                        </select>
                    </div>
                </div>

                <div class="switch-row">
                    <span>转换完成自动复制</span>
                    <input type="checkbox" id="auto-copy" class="switch">
                </div>

                <button id="test-api" class="btn-secondary">测试连接</button>

                <div class="setting-group">
                    <div class="style-template-header">
                        <label>风格模板 <span class="label-optional">（可选）</span></label>
                        <span id="style-template-counter" class="char-counter">0 / 800</span>
                    </div>
                    <textarea id="style-template" class="textarea style-template-area"
                        placeholder="粘贴一段你喜欢的 Markdown 样例，AI 会模仿其格式风格...

例如你偏好的标题层级、分隔符使用、表格或代码块写法等。
AI 只参考格式，不会复制内容。"></textarea>
                    <button id="clear-style-template" class="btn-small secondary" style="align-self:flex-end">清除模板</button>
                </div>

                <div class="setting-group">
                    <div class="style-template-header">
                        <label>
                            <svg class="icon" aria-hidden="true"><use href="#icon-prompt"/></svg>
                            自定义提示词
                        </label>
                    </div>
                    <select id="prompt-doc-type" class="select prompt-type-select"></select>
                    <div class="prompt-editor">
                        <label>系统角色</label>
                        <textarea id="custom-system" class="textarea" placeholder="你是专业的 Markdown 格式化专家..."></textarea>
                        <span class="hint">可用占位符：{HEADING_INSTRUCTION}、{TEXT}</span>
                        <label>转换模板</label>
                        <textarea id="custom-template" class="textarea" placeholder="将以下文本转换为 Markdown..."></textarea>
                    </div>
                    <div class="toolbar">
                        <button id="save-prompt" class="btn-small">保存</button>
                        <button id="reset-prompt" class="btn-small secondary">重置默认</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="settings-panel" style="margin-top:12px;">
            <div class="panel-header" id="toggle-history">
                <span class="panel-title">
                    <svg class="icon" aria-hidden="true"><use href="#icon-history"/></svg>
                    历史记录
                </span>
                <svg class="icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
            </div>
            <div class="panel-content collapsed" id="history-panel">
                <div class="history-empty">暂无历史记录</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Input Section -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <svg class="icon" aria-hidden="true"><use href="#icon-arrow-down"/></svg>
                        输入 (Plain Text)
                    </div>
                    <div class="section-actions">
                        <button id="get-page-text" class="btn-small">
                            <svg class="icon" aria-hidden="true"><use href="#icon-cursor"/></svg>
                            获取选中文字
                        </button>
                        <button id="get-page-content" class="btn-small">
                            <svg class="icon" aria-hidden="true"><use href="#icon-page"/></svg>
                            获取整页正文
                        </button>
                        <button id="paste-btn" class="btn-small">
                            <svg class="icon" aria-hidden="true"><use href="#icon-paste"/></svg>
                            粘贴
                        </button>
                        <button id="clear-btn" class="btn-small secondary">
                            <svg class="icon" aria-hidden="true"><use href="#icon-trash"/></svg>
                            清空
                        </button>
                        <button id="sample-btn" class="btn-small secondary">
                            <svg class="icon" aria-hidden="true"><use href="#icon-file"/></svg>
                            示例
                        </button>
                    </div>
                </div>
                <textarea id="input-text" class="textarea" placeholder="在此粘贴或输入纯文本内容...

AI 会自动识别文档类型并选择最适合的转换策略：
- 技术文档：代码块语言识别、参数表格化
- 会议记录：action items → 任务清单
- 代码片段：精确语言检测
- 数据报告：列式数据 → Markdown 表格
- 通用文本：标准结构化转换"></textarea>
                <div class="input-stats" id="input-stats">0 字符 | 0 行</div>
            </div>

            <!-- Convert Button -->
            <div class="convert-bar">
                <div class="convert-row">
                    <button id="convert-btn" class="btn-convert">
                        <svg class="icon btn-icon-svg" aria-hidden="true"><use href="#icon-sparkle"/></svg>
                        <span id="btn-text">AI 智能转换</span>
                    </button>
                    <div class="doc-type-selector">
                        <label class="selector-label">文档类型</label>
                        <select id="doc-type-override" class="select doc-type-select">
                            <option value="auto">自动识别</option>
                            <option value="technical_doc">技术文档</option>
                            <option value="meeting_notes">会议记录</option>
                            <option value="code_snippet">代码片段</option>
                            <option value="data_report">数据报告</option>
                            <option value="general_prose">通用文本</option>
                        </select>
                    </div>
                </div>
                <div id="loading-indicator" class="loading hidden">
                    <div class="spinner"></div>
                    <span id="loading-text">分析文档结构...</span>
                </div>
            </div>

            <!-- Output Section -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <svg class="icon" aria-hidden="true"><use href="#icon-arrow-up"/></svg>
                        输出 (Markdown)
                    </div>
                    <div class="section-actions">
                        <div class="view-toggle">
                            <button class="view-btn active" data-view="source">
                                <svg class="icon" aria-hidden="true"><use href="#icon-code"/></svg>
                                源码
                            </button>
                            <button class="view-btn" data-view="preview">
                                <svg class="icon" aria-hidden="true"><use href="#icon-eye"/></svg>
                                预览
                            </button>
                            <button class="view-btn" data-view="split">
                                <svg class="icon" aria-hidden="true"><use href="#icon-split"/></svg>
                                分屏
                            </button>
                        </div>
                        <button id="copy-btn" class="btn-small">
                            <svg class="icon" aria-hidden="true"><use href="#icon-copy"/></svg>
                            复制
                        </button>
                        <button id="download-btn" class="btn-small">
                            <svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg>
                            下载
                        </button>
                    </div>
                </div>

                <div class="output-container">
                    <!-- Source View -->
                    <div id="view-source" class="view-content">
                        <textarea id="output-text" class="textarea output" readonly placeholder="转换后的 Markdown 将显示在这里..."></textarea>
                    </div>

                    <!-- Preview View -->
                    <div id="view-preview" class="view-content hidden">
                        <div id="preview-content" class="preview-area"></div>
                    </div>

                    <!-- Split View -->
                    <div id="view-split" class="view-content split hidden">
                        <textarea id="output-text-split" class="textarea output" readonly></textarea>
                        <div id="preview-content-split" class="preview-area"></div>
                    </div>
                </div>

                <div class="output-stats" id="output-stats">0 字符</div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span id="status-text">就绪</span>
            <div class="shortcuts">
                <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> 弹出窗口
                <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 侧边栏
            </div>
        </footer>
    </div>

    <script src="utils.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
