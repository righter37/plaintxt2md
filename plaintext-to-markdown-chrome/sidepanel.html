<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text to Markdown - Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <div>
                    <div class="logo-title">AI Text → Markdown</div>
                    <div class="logo-subtitle">智能文本转换工具</div>
                </div>
            </div>
        </header>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settings-panel">
            <div class="panel-header">
                <span>⚙️ 设置</span>
                <button id="toggle-settings" class="btn-icon">▼</button>
            </div>
            <div class="panel-content" id="settings-content">
                <div class="setting-group">
                    <label>AI 供应商</label>
                    <select id="ai-provider" class="select"></select>
                </div>

                <div class="setting-group">
                    <label>API Key</label>
                    <div class="input-group">
                        <input type="password" id="api-key" class="input" placeholder="输入 API Key">
                        <button id="toggle-key-visibility" class="btn-small">显示</button>
                    </div>
                    <p class="help-text">在 <a id="api-key-link" href="#" target="_blank">控制台</a> 获取 API Key</p>
                </div>

                <div class="setting-row">
                    <div class="setting-group">
                        <label>AI 模型</label>
                        <select id="ai-model" class="select"></select>
                    </div>

                    <div class="setting-group">
                        <label>标题起始级别</label>
                        <select id="heading-level" class="select">
                            <option value="1"># H1（最高级）</option>
                            <option value="2">## H2</option>
                            <option value="3">### H3</option>
                            <option value="4">#### H4</option>
                        </select>
                    </div>
                </div>

                <button id="test-api" class="btn-secondary">测试连接</button>

                <div class="setting-group">
                    <div class="style-template-header">
                        <label>风格模板 <span class="label-optional">（可选）</span></label>
                        <span id="style-template-counter" class="char-counter">0 / 800</span>
                    </div>
                    <textarea id="style-template" class="textarea style-template-area"
                        placeholder="粘贴一段你喜欢的 Markdown 样例，AI 会模仿其格式风格...

例如你偏好的标题层级、分隔符使用、表格或代码块写法等。
AI 只参考格式，不会复制内容。"></textarea>
                    <button id="clear-style-template" class="btn-small secondary" style="align-self:flex-end">清除模板</button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Input Section -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <span class="icon">📥</span>
                        输入 (Plain Text)
                    </div>
                    <div class="section-actions">
                        <button id="get-page-text" class="btn-small">获取页面选中文字</button>
                        <button id="paste-btn" class="btn-small">粘贴</button>
                        <button id="clear-btn" class="btn-small secondary">清空</button>
                        <button id="sample-btn" class="btn-small secondary">示例</button>
                    </div>
                </div>
                <textarea id="input-text" class="textarea" placeholder="在此粘贴或输入纯文本内容...

AI 会自动识别文档类型并选择最适合的转换策略：
- 技术文档：代码块语言识别、参数表格化
- 会议记录：action items → 任务清单
- 代码片段：精确语言检测
- 数据报告：列式数据 → Markdown 表格
- 通用文本：标准结构化转换"></textarea>
                <div class="input-stats" id="input-stats">0 字符 | 0 行</div>
            </div>

            <!-- Convert Button -->
            <div class="convert-bar">
                <div class="convert-row">
                    <button id="convert-btn" class="btn-convert">
                        <span class="btn-icon">✨</span>
                        <span id="btn-text">AI 智能转换</span>
                    </button>
                    <div class="doc-type-selector">
                        <label class="selector-label">文档类型</label>
                        <select id="doc-type-override" class="select doc-type-select">
                            <option value="auto">自动识别</option>
                            <option value="technical_doc">技术文档</option>
                            <option value="meeting_notes">会议记录</option>
                            <option value="code_snippet">代码片段</option>
                            <option value="data_report">数据报告</option>
                            <option value="general_prose">通用文本</option>
                        </select>
                    </div>
                </div>
                <div id="loading-indicator" class="loading hidden">
                    <div class="spinner"></div>
                    <span id="loading-text">分析文档结构...</span>
                </div>
            </div>

            <!-- Output Section -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">
                        <span class="icon">📤</span>
                        输出 (Markdown)
                    </div>
                    <div class="section-actions">
                        <div class="view-toggle">
                            <button class="view-btn active" data-view="source">源码</button>
                            <button class="view-btn" data-view="preview">预览</button>
                            <button class="view-btn" data-view="split">分屏</button>
                        </div>
                        <button id="copy-btn" class="btn-small">复制</button>
                        <button id="download-btn" class="btn-small">下载</button>
                    </div>
                </div>

                <div class="output-container">
                    <!-- Source View -->
                    <div id="view-source" class="view-content">
                        <textarea id="output-text" class="textarea output" readonly placeholder="转换后的 Markdown 将显示在这里..."></textarea>
                    </div>

                    <!-- Preview View -->
                    <div id="view-preview" class="view-content hidden">
                        <div id="preview-content" class="preview-area"></div>
                    </div>

                    <!-- Split View -->
                    <div id="view-split" class="view-content split hidden">
                        <textarea id="output-text-split" class="textarea output" readonly></textarea>
                        <div id="preview-content-split" class="preview-area"></div>
                    </div>
                </div>

                <div class="output-stats" id="output-stats">0 字符</div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span id="status-text">就绪</span>
            <div class="shortcuts">
                <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> 弹出窗口
                <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 侧边栏
            </div>
        </footer>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
